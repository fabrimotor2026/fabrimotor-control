<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="FM Control" />
    <meta name="description" content="Sistema de control de producción, calidad y trazabilidad de Fabrimotor." />
    <meta name="theme-color" content="#1f6f73" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FM Control" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Fabrimotor" />
    <meta property="og:title" content="FM Control | Fabrimotor" />
    <meta property="og:description" content="Sistema de control de producción, calidad y trazabilidad de Fabrimotor." />
    <meta property="og:url" content="https://fmcontrol.fabrimotor.com/" />
    <meta property="og:image" content="https://fmcontrol.fabrimotor.com/fm-control-social.png" />

    <link rel="canonical" href="https://fmcontrol.fabrimotor.com/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <title>FM Control | Fabrimotor</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f5f8fa; }
      .fm-boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #173b3e;
        background: radial-gradient(circle at 50% 35%, #ffffff 0, #f5f8fa 55%, #e8eff1 100%);
      }
      .fm-boot__card { text-align: center; }
      .fm-boot__logo { width: min(440px, 72vw); height: auto; display: block; margin: 0 auto 24px; }
      .fm-boot__title { margin: 0; font-size: clamp(22px, 3vw, 32px); font-weight: 800; letter-spacing: -0.02em; }
      .fm-boot__subtitle { margin: 8px 0 22px; color: #5f7275; font-size: 14px; }
      .fm-boot__bar { width: 180px; height: 4px; margin: 0 auto; overflow: hidden; border-radius: 999px; background: #d9e4e6; }
      .fm-boot__bar::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #1f6f73; animation: fm-loading 1.15s ease-in-out infinite alternate; }
      @keyframes fm-loading { from { transform: translateX(-20%); } to { transform: translateX(145%); } }
      @media (prefers-reduced-motion: reduce) { .fm-boot__bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="fm-boot" aria-label="Cargando FM Control">
        <div class="fm-boot__card">
          <img class="fm-boot__logo" src="/logo-fabrimotor.png" alt="Fabrimotor" />
          <h1 class="fm-boot__title">FM Control</h1>
          <p class="fm-boot__subtitle">Producción · Calidad · Trazabilidad</p>
          <div class="fm-boot__bar" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
